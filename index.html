<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breadmaster101</title>
  <meta name="description" content="Games and tools by breadmaster101 that run in the browser.">
  <meta name="theme-color" content="#1c1d21">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

  <div class="site">
    <header class="nav">
      <a class="logo" href="./">breadmaster101<span class="tld">.github.io</span></a>
      <nav>
        <a href="https://github.com/Breadmaster101" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <main class="split">
      <aside class="side">
        <h1>I make games, tools, and apps that run in the browser.</h1>
        <div class="filters" id="filters" role="radiogroup" aria-label="Filter projects"></div>
        <input id="search" type="search" placeholder="Search" aria-label="Search projects" autocomplete="off">
      </aside>

      <section class="stack" id="projects" aria-live="polite"></section>
    </main>

    <footer class="foot">
      <span>© <span id="year">2026</span> Breadmaster101</span>
    </footer>
  </div>
</body>
</html>
