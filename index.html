<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breadmaster</title>
  <meta name="description" content="Games and tools by breadmaster101 that run in the browser.">
  <meta name="theme-color" content="#1c1d21">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0c0d'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23e8a24c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

  <div class="site">
    <header class="nav reveal" style="--i: 0">
      <a class="logo" href="./">breadmaster101<span class="tld">.github.io</span></a>
      <nav>
        <a href="https://github.com/Breadmaster101" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <main class="split">
      <aside class="side">
        <h1 class="reveal" style="--i: 1">I make games and tools that run in the browser.</h1>
        <div class="filters reveal" style="--i: 3" id="filters" role="radiogroup" aria-label="Filter projects"></div>
        <input class="reveal" style="--i: 4" id="search" type="search" placeholder="Search" aria-label="Search projects" autocomplete="off">
      </aside>

      <section class="stack" id="projects" aria-live="polite"></section>
    </main>

    <footer class="foot">
      <span>© <span id="year">2026</span> breadmaster101</span>
    </footer>
  </div>
</body>
</html>
